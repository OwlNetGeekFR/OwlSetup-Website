name: Synchroniser et publier le site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Sans cache npm : ce job a les droits d’écriture sur le dépôt et Pages.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Installer les dépendances
        run: npm ci

      - name: Synchroniser la dernière Release stable
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/sync-release.ps1

      # La construction échoue si release.json est incomplet (src/lib/release.ts).
      - name: Construire le site
        run: npm run build

      - name: Vérifier le site
        shell: pwsh
        run: |
          foreach ($page in "index.html", "404.html", "release.json", "telecharger/index.html", "fonctionnalites/index.html", "securite/index.html", "guide-installation/index.html", "CNAME", ".well-known/security.txt") {
            if (-not (Test-Path "dist/$page")) { throw "Fichier absent du site construit : $page" }
          }
          $manifest = Get-Content release.json -Raw | ConvertFrom-Json
          if (-not (Select-String -Path dist/index.html -SimpleMatch $manifest.assets.'OwlSetup-Setup.exe'.url -Quiet)) {
            throw "La page d'accueil ne pointe pas vers l'installateur de la version $($manifest.version)."
          }
          git diff --check

      - name: Vérifier que la branche propose les métadonnées actuelles
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- release.json

      - name: Enregistrer une nouvelle version détectée
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git diff --quiet -- release.json
          if ($LASTEXITCODE -ne 0) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add release.json
            git commit -m "Synchroniser la Release OwlSetup [skip ci]"
            git push origin HEAD:main
          }

      - name: Configurer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Sans include-hidden-files, les dossiers commençant par un point sont
      # retirés en silence : /.well-known/security.txt répondait 404.
      # .git et .github restent toujours exclus par l'action.
      - name: Préparer les fichiers GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Vérifier les fichiers publiés
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGE_URL%/}/"
          for page in "" "release.json" ".well-known/security.txt"; do
            curl --fail --silent --show-error --output /dev/null \
              --retry 6 --retry-delay 10 --retry-all-errors \
              "$base$page"
          done
