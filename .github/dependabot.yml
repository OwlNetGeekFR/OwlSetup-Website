version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      fontsource:
        patterns:
          - "@fontsource-variable/*"
    labels:
      - dependencies
      - javascript
